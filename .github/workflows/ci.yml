name: CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Security Audit & Secret Leak Detection
  # -------------------------------------------------------------
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scan (Prevent Leaked Environment Files & Keys)
        run: |
          echo "Scanning git tracked files for accidental secrets..."
          LEAKED_FILES=$(git ls-files | grep -E "(^|\/)\.env($|\..*)" | grep -v "\.env\.example" || true)
          if [ -n "$LEAKED_FILES" ]; then
            echo "ERROR: Tracked .env secret file detected in repository:"
            echo "$LEAKED_FILES"
            exit 1
          fi
          echo "No tracked secret .env files detected."

      - name: Run NPM Security Audit
        run: |
          npm audit --audit-level=critical || echo "Audit completed with advisory warnings"

  # -------------------------------------------------------------
  # Job 2: Automated Tests & Static Code Verification
  # -------------------------------------------------------------
  test-suite:
    name: Automated Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node-version: [20.x, 22.x]
      fail-fast: false
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Configurations & JSON Schemas
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            function scan(dir) {
              for (const item of fs.readdirSync(dir)) {
                if (item === 'node_modules' || item === 'dist' || item === '.git' || item.startsWith('.')) continue;
                const full = path.join(dir, item);
                if (fs.statSync(full).isDirectory()) scan(full);
                else if (full.endsWith('.json')) {
                  JSON.parse(fs.readFileSync(full, 'utf8'));
                }
              }
            }
            scan('.');
            console.log('JSON & Manifest integrity verification passed.');
          "

      - name: Run Test Suites (when tracked)
        run: |
          if [ -d "scripts" ] && [ -f "scripts/invoice-template.test.mjs" ]; then
            npm run test:pdf
          else
            echo "PDF template tests excluded by .gitignore policy"
          fi

          if [ -d "scripts" ] && [ -f "scripts/email-template.test.mjs" ]; then
            npm run test:email
          else
            echo "Email template tests excluded by .gitignore policy"
          fi

          if [ -d "worker/test" ] && [ -f "worker/test/auth.test.mjs" ]; then
            npm run test:worker
          else
            echo "Worker tests excluded by .gitignore policy"
          fi

          if [ -d "supabase/tests" ] && [ -f "supabase/tests/rbac.test.mjs" ]; then
            npm run test:db
          else
            echo "Supabase tests excluded by .gitignore policy"
          fi

  # -------------------------------------------------------------
  # Job 3: Production Build & Asset Verification
  # -------------------------------------------------------------
  build-verification:
    name: Production Build & Bundle Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [security-audit, test-suite]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Verify Build Artifacts
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html not found!"
            exit 1
          fi
          echo "Build verification passed: dist/ exists and contains index.html"
          ls -lh dist/index.html

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: production-dist
          path: dist/
          retention-days: 7
